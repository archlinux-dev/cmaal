name: lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck cmaal install.sh completions/cmaal.bash
      - name: syntax
        run: |
          bash -n cmaal
          bash -n install.sh
      - name: VERSION matches script
        run: |
          script_version=$(sed -n 's/^CMAAL_VERSION="\(.*\)"/\1/p' cmaal)
          file_version=$(tr -d '[:space:]' < VERSION)
          echo "script: $script_version  VERSION: $file_version"
          test "$script_version" = "$file_version"
